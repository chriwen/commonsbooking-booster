name: PHP Unit Tests

on:
  push:
    branches:
      - 'master'
      - 'release/**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.txt'
  pull_request:
    branches:
      - 'master'
    paths-ignore:
      - 'docs/**'


env:
  DB_DATABASE: wordpress_test
  DB_USER: root
  DB_PASSWORD: ''

jobs:
  phpunit:
    name: 'WP ${{ matrix.core.name }} on PHP ${{ matrix.php }}${{ matrix.use_index == ''0'' && '' (legacy queries)'' || '''' }}${{ matrix.use_availability == ''0'' && '' (live availability)'' || '''' }}${{ matrix.use_booster == ''0'' && '' (booster off)'' || '''' }}'

    runs-on: ubuntu-24.04

    strategy:
      matrix:
        php:
          - '8.1'
          - '8.4'
        core:
          - { name: 'latest', version: 'latest' }
          - { name: 'minimum', version: '5.9' }
          - { name: 'trunk', version: 'trunk' }
        use_index:
          - '1'
        use_availability:
          - '1'
        use_booster:
          - '1'
        include:
          # Run once with the performance booster switched off: no hooks, no cron jobs, original queries
          # (this is how the plugin behaves after the update until the booster is switched on)
          - php: '8.1'
            core: { name: 'latest', version: 'latest' }
            use_index: '1'
            use_availability: '1'
            use_booster: '0'
          # Run once with the timeframe index disabled, to keep the legacy postmeta queries tested
          # (the precomputed availability needs the index and is off then, too)
          - php: '8.1'
            core: { name: 'latest', version: 'latest' }
            use_index: '0'
            use_availability: '1'
            use_booster: '1'
          # Run once with the index but without precomputed availability (every day computed live)
          - php: '8.1'
            core: { name: 'latest', version: 'latest' }
            use_index: '1'
            use_availability: '0'
            use_booster: '1'

    steps:
    - uses: actions/checkout@v7

    - name: Set up MySQL
      run: |
        sudo /etc/init.d/mysql start

    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: uopz

    # This is needed for the WordPress test suite installation ( bin/install-wp-tests.sh )
    - name: Install SVN
      run: sudo apt install -y subversion

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies (PHP 8.1)
      if: matrix.php == '8.1'
      run: |
        bash bin/install-wp-tests.sh wordpress_test root root localhost ${{ matrix.core.version }}
        composer install --prefer-dist --no-progress

    - name: Install dependencies (other PHP versions)
      if: matrix.php != '8.1'
      run: |
        bash bin/install-wp-tests.sh wordpress_test root root localhost ${{ matrix.core.version }}
        composer install --prefer-dist --no-progress --ignore-platform-reqs

    - name: Run test suite
      env:
        CB_USE_INDEX: ${{ matrix.use_index }}
        CB_USE_AVAILABILITY: ${{ matrix.use_availability }}
        CB_USE_BOOSTER: ${{ matrix.use_booster }}
      run: |
        composer dump-autoload -o
        php vendor/bin/phpunit

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./build/logs/clover.xml
  rerun-on-failure:
    needs: phpunit
    if: failure() && fromJSON(github.run_attempt) < 3
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GH_DEBUG: api
        run: gh workflow run rerun.yml -r ${{ github.head_ref || github.ref_name }} -F run_id=${{ github.run_id }}
